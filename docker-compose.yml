services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adorno-backend
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env         
    restart: unless-stopped
    networks:
      - adorno-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adorno-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - adorno-network

networks:
  adorno-network:
    driver: bridge